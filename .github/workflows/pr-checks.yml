name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.11"

jobs:
  compose:
    name: Compose client
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate UI tokens
        run: python3 scripts/generate_ui_tokens.py

      - name: Check generated UI tokens
        run: git diff --exit-code -- compose/shared/src/commonMain/kotlin/com/finance/tracker/core/design/GeneratedTokens.kt

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Compose shared tests
        working-directory: compose
        run: ./gradlew :shared:wasmJsTest --no-configuration-cache

      - name: Build Compose Web distribution
        working-directory: compose
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-configuration-cache

      - name: Verify normal Web build keeps demo mode off
        run: >-
          grep -Fq 'COMPOSE_DEMO_MODE: Boolean = false' compose/shared/build/generated/source/buildkonfig/commonMain/com/finance/tracker/shared/ComposeBuildConfig.kt

      - name: Build Compose offline demo distribution
        working-directory: compose
        run: FT_COMPOSE_DEMO_MODE=true ./gradlew :webApp:wasmJsBrowserDistribution --no-configuration-cache

      - name: Verify Web demo build enables demo mode
        run: >-
          grep -Fq 'COMPOSE_DEMO_MODE: Boolean = true' compose/shared/build/generated/source/buildkonfig/commonMain/com/finance/tracker/shared/ComposeBuildConfig.kt

      - name: Check production Compose Web demo boundary
        run: python3 compose/tests/test_build_wasm_web.py

      - name: Install Compose QA dependencies
        working-directory: compose/qa/web
        run: npm ci

      - name: Install Chromium for platform semantics regression
        working-directory: compose/qa/web
        run: npx playwright install chromium

      - name: Check Compose preview tooling and platform semantics
        working-directory: compose/qa/web
        run: npm run test:node

  backend-kotlin:
    name: Backend (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finance_tracker_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FT_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/finance_tracker_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test the Kotlin backend
        working-directory: compose
        run: >-
          ./gradlew :backend:test :backend:codegenTest
          :business-contracts:jvmTest :business-domain:jvmTest
          :backend:ktlintCheck :backend:detekt :backend:installDist --no-configuration-cache

      - name: Check the production server entrypoint
        working-directory: compose
        run: test -x backend/build/install/backend/bin/backend
