name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.11"

jobs:
  backend-profile:
    name: Backend profiling (temporary)
    if: github.event.pull_request.number == 101
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finance_tracker_profile_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_tracker_profile_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data:rw,size=2g
    env:
      FT_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/finance_tracker_profile_test
      FT_REQUIRE_TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Prepare matching temporary disk
        run: |
          profile_tmp="$RUNNER_TEMP/pr101-profile-tmp"
          mkdir -p "$profile_tmp"
          sudo mount -t tmpfs -o size=2g,mode=1777 tmpfs "$profile_tmp"
      - name: Profile synthetic failures without replacing the performance gate
        env:
          TMPDIR: ${{ runner.temp }}/pr101-profile-tmp
        run: PYTHONPATH=tests:.:src uv run python scripts/profile_pr101_backend.py "$RUNNER_TEMP/pr101-profile"
      - name: Unmount diagnostic temporary disk
        if: always()
        run: |
          profile_tmp="$RUNNER_TEMP/pr101-profile-tmp"
          if mountpoint -q "$profile_tmp"; then
            sudo umount "$profile_tmp"
          fi

  compose:
    name: Compose client
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate UI tokens
        run: python3 scripts/generate_ui_tokens.py

      - name: Check generated UI tokens
        run: git diff --exit-code -- compose/shared/src/commonMain/kotlin/com/finance/tracker/core/design/GeneratedTokens.kt

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Compose shared tests
        working-directory: compose
        run: ./gradlew :shared:wasmJsTest --no-configuration-cache

      - name: Build Compose Web distribution
        working-directory: compose
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-configuration-cache

      - name: Verify normal Web build keeps demo mode off
        run: >-
          grep -Fq 'COMPOSE_DEMO_MODE: Boolean = false' compose/shared/build/generated/source/buildkonfig/commonMain/com/finance/tracker/shared/ComposeBuildConfig.kt

      - name: Build Compose offline demo distribution
        working-directory: compose
        run: FT_COMPOSE_DEMO_MODE=true ./gradlew :webApp:wasmJsBrowserDistribution --no-configuration-cache

      - name: Verify Web demo build enables demo mode
        run: >-
          grep -Fq 'COMPOSE_DEMO_MODE: Boolean = true' compose/shared/build/generated/source/buildkonfig/commonMain/com/finance/tracker/shared/ComposeBuildConfig.kt

      - name: Check production Compose Web demo boundary
        run: python3 compose/tests/test_build_wasm_web.py

      - name: Check live and offline Compose preview servers
        run: node --test compose/qa/web/tests/compose-preview-proxy.node-test.mjs

  backend-sqlite-shards:
    name: Backend (SQLite shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install Python dependencies
        run: uv sync

      - name: Compile Python sources
        run: uv run python -m compileall -q src

      - name: Run SQLite backend tests
        run: >-
          PYTHONPATH=tests:.:src uv run python scripts/run_backend_tests.py
          --shard-index "${{ matrix.shard }}" --shard-count 8

  backend-sqlite:
    name: Backend (SQLite)
    if: ${{ always() }}
    needs: backend-sqlite-shards
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard to succeed
        env:
          SHARD_RESULT: ${{ needs.backend-sqlite-shards.result }}
        run: test "$SHARD_RESULT" = success

  backend-postgres-shards:
    name: Backend (PostgreSQL shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finance_tracker_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FT_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/finance_tracker_test
      FT_REQUIRE_TEST_POSTGRES: "1"
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install Python dependencies
        run: uv sync

      - name: Compile Python sources
        run: uv run python -m compileall -q src

      - name: Run PostgreSQL backend tests
        run: >-
          PYTHONPATH=tests:.:src uv run python scripts/run_backend_tests.py
          --shard-index "${{ matrix.shard }}" --shard-count 8

  backend-postgres:
    name: Backend (PostgreSQL)
    if: ${{ always() }}
    needs: backend-postgres-shards
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard to succeed
        env:
          SHARD_RESULT: ${{ needs.backend-postgres-shards.result }}
        run: test "$SHARD_RESULT" = success

  backend-performance:
    name: Backend (Performance)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finance_tracker_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data:rw,size=2g
    env:
      FT_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/finance_tracker_test
      FT_REQUIRE_TEST_POSTGRES: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install Python dependencies
        run: uv sync

      - name: Compile Python sources
        run: uv run python -m compileall -q src

      - name: Prepare in-memory SQLite temporary directory
        shell: bash
        run: |
          performance_tmp="$RUNNER_TEMP/finance-tracker-performance-tmp"
          mkdir -p "$performance_tmp"
          sudo mount -t tmpfs -o size=2g,mode=1777 tmpfs "$performance_tmp"

      - name: Run isolated backend performance tests
        env:
          TMPDIR: ${{ runner.temp }}/finance-tracker-performance-tmp
        run: >-
          PYTHONPATH=tests:.:src uv run pytest -q
          --basetemp "$TMPDIR/pytest" -m performance

      - name: Unmount in-memory SQLite temporary directory
        if: always()
        shell: bash
        run: |
          performance_tmp="$RUNNER_TEMP/finance-tracker-performance-tmp"
          if mountpoint -q "$performance_tmp"; then
            sudo umount "$performance_tmp"
          fi
