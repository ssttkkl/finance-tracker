name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.11"

jobs:
  compose:
    name: Compose client
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate UI tokens
        run: python3 scripts/generate_ui_tokens.py

      - name: Check generated UI tokens
        run: git diff --exit-code -- compose/shared/src/commonMain/kotlin/com/finance/tracker/core/design/GeneratedTokens.kt

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Compose shared tests
        working-directory: compose
        run: ./gradlew :shared:wasmJsTest --no-configuration-cache

      - name: Build Compose Web distribution
        working-directory: compose
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-configuration-cache

      - name: Verify normal Web build keeps demo mode off
        run: >-
          grep -Fq 'COMPOSE_DEMO_MODE: Boolean = false' compose/shared/build/generated/source/buildkonfig/commonMain/com/finance/tracker/shared/ComposeBuildConfig.kt

      - name: Build Compose offline demo distribution
        working-directory: compose
        run: FT_COMPOSE_DEMO_MODE=true ./gradlew :webApp:wasmJsBrowserDistribution --no-configuration-cache

      - name: Verify Web demo build enables demo mode
        run: >-
          grep -Fq 'COMPOSE_DEMO_MODE: Boolean = true' compose/shared/build/generated/source/buildkonfig/commonMain/com/finance/tracker/shared/ComposeBuildConfig.kt

      - name: Check production Compose Web demo boundary
        run: python3 compose/tests/test_build_wasm_web.py

      - name: Install Compose QA dependencies
        working-directory: compose/qa/web
        run: npm ci

      - name: Install Chromium for platform semantics regression
        working-directory: compose/qa/web
        run: npx playwright install chromium

      - name: Check Compose preview tooling and platform semantics
        working-directory: compose/qa/web
        run: npm run test:node


  web-e2e:
    name: Compose Web E2E
    runs-on: macos-26
    timeout-minutes: 60
    env:
      FT_COMPOSE_PREVIEW_PORT: "5187"
      FT_API_PROXY_ORIGIN: http://127.0.0.1:19261
      FT_HOST: 127.0.0.1
      FT_KOTLIN_PORT: "19261"
      FT_WEB_ORIGIN: http://127.0.0.1:5187
      FT_IMPORT_STAGING_BACKEND: memory
      FT_IMPORT_STAGING_ALLOW_MEMORY: "1"
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Compose QA dependencies
        working-directory: compose/qa/web
        run: npm ci

      - name: Install Chromium
        working-directory: compose/qa/web
        run: npx playwright install chromium

      - name: Build the backend and verified Web preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/finance-web-e2e"
          ./compose/gradlew -p compose :backend:installDist --no-configuration-cache 2>&1 | tee "$RUNNER_TEMP/finance-web-e2e/backend-build.log"
          node compose/qa/web/scripts/start-compose-demo.mjs --build-only 2>&1 | tee "$RUNNER_TEMP/finance-web-e2e/web-build.log"

      - name: Run the complete browser suite against the local backend
        shell: bash
        run: |
          set -euo pipefail
          qa_runtime="$RUNNER_TEMP/finance-web-e2e"
          export FT_DATABASE_URL="sqlite+pysqlite:///$qa_runtime/web-e2e_test.db"
          export PLAYWRIGHT_HTML_OUTPUT_DIR="$qa_runtime/report"
          ./compose/backend/build/install/backend/bin/backend > "$qa_runtime/backend.log" 2>&1 &
          backend_pid=$!
          cleanup() {
            kill "$backend_pid" 2>/dev/null || true
            wait "$backend_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          backend_ready=false
          for attempt in {1..60}; do
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              cat "$qa_runtime/backend.log"
              exit 1
            fi
            if curl --fail --silent --connect-timeout 1 --max-time 2 "$FT_API_PROXY_ORIGIN/health" > /dev/null; then
              backend_ready=true
              break
            fi
            sleep 1
          done
          if [ "$backend_ready" != true ]; then
            cat "$qa_runtime/backend.log"
            echo "Kotlin backend did not become healthy" >&2
            exit 1
          fi
          npm --prefix compose/qa/web run test:e2e -- --reporter=list,html --output "$qa_runtime/results" 2>&1 | tee "$qa_runtime/playwright.log"

      - name: Upload browser report and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: compose-web-e2e-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/finance-web-e2e/*.log
            ${{ runner.temp }}/finance-web-e2e/report
            ${{ runner.temp }}/finance-web-e2e/results
            compose/qa/web/test-results/evidence

  backend-kotlin:
    name: Backend (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finance_tracker_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FT_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/finance_tracker_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test the Kotlin backend
        working-directory: compose
        run: >-
          ./gradlew :backend:test :backend:codegenTest
          :business-contracts:jvmTest :business-domain:jvmTest
          :backend:ktlintCheck :backend:detekt :backend:installDist --no-configuration-cache

      - name: Check the production server entrypoint
        working-directory: compose
        run: test -x backend/build/install/backend/bin/backend
