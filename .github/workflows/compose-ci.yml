name: Compose CI

on:
  pull_request:
  push:
    branches:
      - refactor/kmp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.11"

jobs:
  compose:
    name: Compose shared and native checks
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate UI tokens
        run: python3 scripts/generate_ui_tokens.py

      - name: Check generated UI tokens
        run: git diff --exit-code -- compose/shared/src/commonMain/kotlin/com/finance/tracker/core/design/GeneratedTokens.kt

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Compose shared tests
        working-directory: compose
        run: ./gradlew :shared:wasmJsTest --no-configuration-cache

      - name: Build Compose Web distribution
        working-directory: compose
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-configuration-cache

      - name: Verify normal Web build keeps demo mode off
        run: >-
          grep -Fq 'COMPOSE_DEMO_MODE: Boolean = false' compose/shared/build/generated/source/buildkonfig/commonMain/com/finance/tracker/shared/ComposeBuildConfig.kt

      - name: Build Compose offline demo distribution
        working-directory: compose
        run: FT_COMPOSE_DEMO_MODE=true ./gradlew :webApp:wasmJsBrowserDistribution --no-configuration-cache

      - name: Verify Web demo build enables demo mode
        run: >-
          grep -Fq 'COMPOSE_DEMO_MODE: Boolean = true' compose/shared/build/generated/source/buildkonfig/commonMain/com/finance/tracker/shared/ComposeBuildConfig.kt

      - name: Build Android debug app
        working-directory: compose
        run: ./gradlew :androidApp:assembleDebug --no-configuration-cache

      - name: Verify normal Android debug build keeps demo mode off
        run: |
          grep -Fq 'Boolean.parseBoolean("true")' compose/androidApp/build/generated/source/buildConfig/debug/com/finance/tracker/BuildConfig.java
          grep -Fq 'COMPOSE_DEMO_MODE: Boolean = false' compose/shared/build/generated/source/buildkonfig/commonMain/com/finance/tracker/shared/ComposeBuildConfig.kt

      - name: Build Android offline demo app
        working-directory: compose
        run: FT_COMPOSE_DEMO_MODE=true ./gradlew :androidApp:assembleDebug --no-configuration-cache

      - name: Verify Android demo and release boundaries
        run: |
          grep -Fq 'COMPOSE_DEMO_MODE: Boolean = true' compose/shared/build/generated/source/buildkonfig/commonMain/com/finance/tracker/shared/ComposeBuildConfig.kt
          FT_COMPOSE_DEMO_MODE=true ./gradlew -p compose :androidApp:assembleRelease --no-configuration-cache
          grep -Fq 'DEBUG = false' compose/androidApp/build/generated/source/buildConfig/release/com/finance/tracker/BuildConfig.java

      - name: Run Compose iOS simulator checks
        working-directory: compose
        run: ./gradlew :shared:iosSimulatorArm64Test :shared:linkDebugFrameworkIosSimulatorArm64 --no-configuration-cache
