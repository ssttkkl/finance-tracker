name: Compose CI

on:
  pull_request:
  push:
    branches:
      - refactor/kmp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  compose:
    name: Compose shared and native checks
    runs-on: macos-26
    timeout-minutes: 45
    env:
      PEN_CLI_KEY: ${{ secrets.PEN_CLI_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workflow tools
        run: npm ci --no-audit --no-fund

      - name: Generate UI tokens
        run: npm run tokens:generate

      - name: Check generated UI tokens
        run: git diff --exit-code -- compose/shared/src/commonMain/kotlin/com/finance/tracker/core/design/GeneratedTokens.kt design/generated/pen-variables.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Compose shared tests
        working-directory: compose
        run: ./gradlew :shared:wasmJsTest --no-configuration-cache

      - name: Build Compose Web distribution
        working-directory: compose
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-configuration-cache

      - name: Build Android debug app
        working-directory: compose
        run: ./gradlew :androidApp:assembleDebug --no-configuration-cache

      - name: Run Compose iOS simulator checks
        working-directory: compose
        run: ./gradlew :shared:iosSimulatorArm64Test :shared:linkDebugFrameworkIosSimulatorArm64 --no-configuration-cache

      - name: Run pen.dev validation and export
        if: ${{ env.PEN_CLI_KEY != '' }}
        run: |
          if ! npx --no-install pen status >/dev/null 2>&1; then
            echo "pen.dev authentication check failed"
            exit 1
          fi
          export_dir="$RUNNER_TEMP/pen-export"
          mkdir -p "$export_dir"
          for source in design/finance-design-system.lib.pen design/login.pen; do
            label="$(basename "$source" .pen)"
            commands_file="$RUNNER_TEMP/pen-$label.commands"
            before_count="$(find "$export_dir" -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')"
            node - "$source" "$export_dir" > "$commands_file" <<'NODE'
          const fs = require('node:fs');
          const [source, exportDir] = process.argv.slice(2);
          const document = JSON.parse(fs.readFileSync(source, 'utf8'));
          const frames = (document.children || []).filter((node) => node.type === 'frame');
          if (frames.length === 0) throw new Error(`No frames in ${source}`);
          const input = `Export(${JSON.stringify(frames.map((frame) => frame.id))}, "png", ${JSON.stringify(exportDir)})`;
          process.stdout.write(`execute({input: ${JSON.stringify(input)}})\nexit()\n`);
          NODE
            npx --no-install pen interactive --in "$source" --out "$RUNNER_TEMP/$label.pen" < "$commands_file"
            after_count="$(find "$export_dir" -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')"
            test "$((after_count - before_count))" -eq "$(node -e 'const fs=require("node:fs");const document=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String((document.children||[]).filter((node)=>node.type==="frame").length))' "$source")"
          done

      - name: Record pen.dev validation skip
        if: ${{ env.PEN_CLI_KEY == '' }}
        run: echo "pen.dev validation skipped (PEN_CLI_KEY is not configured)"
