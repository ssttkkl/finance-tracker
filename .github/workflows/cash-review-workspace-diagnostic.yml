name: Cash review workspace diagnostic

on:
  push:
    branches: [perf/encrypted-cash-review-workspace]

permissions:
  contents: read

concurrency:
  group: cash-review-workspace-diagnostic
  cancel-in-progress: false

jobs:
  compare:
    name: Cash review workspace comparison
    runs-on: ubuntu-26.04
    timeout-minutes: 140
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ft_performance
          POSTGRES_PASSWORD: disposable_ci_password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ft_performance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FT_PERF_PG_ADMIN_URL: postgresql://ft_performance:disposable_ci_password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare measurement environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qpdf postgresql-client time
          parent=$(sudo mktemp -d /sys/fs/cgroup/ft-workspace-XXXXXX)
          printf '+memory\n' | sudo tee "$parent/cgroup.subtree_control" >/dev/null
          sudo chown "$(id -u):$(id -g)" "$parent"
          printf 'FT_PERF_CGROUP_PARENT=%s\nFT_PERF_CGROUP_SUDO=1\n' "$parent" >> "$GITHUB_ENV"
      - name: Build and install both packages before measurement
        run: bash compose/client-operations/perf/workspace-diagnostic/compare.sh build
      - name: Run workspace integrity and interruption checks
        run: node --test compose/cli/test/storage.test.cjs
      - name: Compare the original fixture in opposite orders on this runner
        run: bash compose/client-operations/perf/workspace-diagnostic/compare.sh measure
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cash-review-workspaces-${{ github.sha }}
          path: ${{ runner.temp }}/cash-review-workspace-reports
          if-no-files-found: error
          retention-days: 30
