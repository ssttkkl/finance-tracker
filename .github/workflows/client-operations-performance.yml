name: Client operations performance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: client-operations-performance-${{ github.ref }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

env:
  FT_PERF_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  plan:
    name: Select performance repetitions
    runs-on: ubuntu-26.04
    outputs:
      repetitions: ${{ steps.plan.outputs.repetitions }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - id: plan
        name: Select one run or five calibration runs for this commit
        run: |
          if git log -1 --format=%B | grep -Fx 'Performance-Calibration: five hosted runners'; then
            printf 'repetitions=[1,2,3,4,5]\n' >> "$GITHUB_OUTPUT"
          else
            printf 'repetitions=[1]\n' >> "$GITHUB_OUTPUT"
          fi

  ordinary:
    name: Ordinary operations (${{ matrix.lane }} / ${{ matrix.replica }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        replica: ${{ fromJSON(needs.plan.outputs.repetitions) }}
        lane: [shared, cli]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify gate failure handling
        run: node --test compose/client-operations/perf/gate.test.mjs
      - name: Ensure the client peak RSS tool is available
        run: |
          if [ ! -x /usr/bin/time ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends time
          fi
      - name: Measure ordinary operations and installed CLI commands
        env:
          FT_PERF_REPLICA: ${{ matrix.replica }}
          FT_PERF_ORDINARY_LANE: ${{ matrix.lane }}
        run: node compose/client-operations/perf/run-gate.mjs ordinary "$RUNNER_TEMP/client-operations-performance"
      - name: Upload ordinary measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordinary-${{ matrix.lane }}-performance-${{ github.run_attempt }}-${{ matrix.replica }}
          path: ${{ runner.temp }}/client-operations-performance
          if-no-files-found: error
          retention-days: 30

  maximum:
    name: Maximum cash import (${{ matrix.replica }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        replica: ${{ fromJSON(needs.plan.outputs.repetitions) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ft_performance
          POSTGRES_PASSWORD: disposable_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ft_performance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FT_PERF_PG_ADMIN_URL: postgresql://ft_performance:disposable_ci_password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install synthetic fixture and measurement tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qpdf postgresql-client time
      - name: Allocate isolated Linux memory accounting
        run: |
          parent=$(sudo mktemp -d /sys/fs/cgroup/ft-perf-XXXXXX)
          printf '+memory\n' | sudo tee "$parent/cgroup.subtree_control" >/dev/null
          sudo chown "$(id -u):$(id -g)" "$parent"
          printf 'FT_PERF_CGROUP_PARENT=%s\nFT_PERF_CGROUP_SUDO=1\n' "$parent" >> "$GITHUB_ENV"
      - name: Verify subprocess failure handling
        run: node --test compose/client-operations/perf/{large-measure,request-gate,request-observation,service-memory}.test.mjs
      - name: Measure synthetic 19-file import and cold readback
        env:
          FT_PERF_REPLICA: ${{ matrix.replica }}
        run: node compose/client-operations/perf/run-gate.mjs maximum "$RUNNER_TEMP/client-operations-performance"
      - name: Upload maximum measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maximum-performance-${{ github.run_attempt }}-${{ matrix.replica }}
          path: ${{ runner.temp }}/client-operations-performance
          if-no-files-found: error
          retention-days: 30

  gate:
    name: client-operations-performance
    runs-on: ubuntu-26.04
    if: always()
    needs: [plan, ordinary, maximum]
    permissions: {}
    steps:
      - name: Require both measurements to finish and pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          ORDINARY_RESULT: ${{ needs.ordinary.result }}
          MAXIMUM_RESULT: ${{ needs.maximum.result }}
        run: |
          test "$PLAN_RESULT" = success
          printf 'Ordinary: %s\nMaximum: %s\n' "$ORDINARY_RESULT" "$MAXIMUM_RESULT"
          test "$ORDINARY_RESULT" = success
          test "$MAXIMUM_RESULT" = success
