name: Terminal review context diagnostic

on:
  push:
    branches: [perf/omit-terminal-review-context]

permissions:
  contents: read

jobs:
  terminal-context:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ft_performance
          POSTGRES_PASSWORD: disposable_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ft_performance"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      FT_DIAGNOSTIC_PG: postgresql://ft_performance:disposable_ci_password@127.0.0.1:5432
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare dedicated synthetic databases and delegated memory accounting
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qpdf postgresql-client time
          psql "$FT_DIAGNOSTIC_PG/postgres" -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE review_context_test"
          psql "$FT_DIAGNOSTIC_PG/postgres" -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE review_context_heap_test"
          parent=$(sudo mktemp -d /sys/fs/cgroup/ft-perf-XXXXXX)
          printf '+memory\n' | sudo tee "$parent/cgroup.subtree_control" >/dev/null
          sudo chown "$(id -u):$(id -g)" "$parent"
          printf 'FT_PERF_CGROUP_PARENT=%s\nFT_PERF_CGROUP_SUDO=1\n' "$parent" >> "$GITHUB_ENV"
      - name: Build the single-variable pair and verify review contracts
        id: packages
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/terminal-context"
          control="$RUNNER_TEMP/review-context-control"
          mkdir -p "$out/base" "$out/terminal"
          git worktree add --detach "$control" "$GITHUB_SHA"
          python3 - "$control" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1]) / 'compose/client-operations/src/commonMain/kotlin/com/finance/tracker/client/CashImportReviewOperations.kt'
          text = p.read_text()
          marker = 'includeInteractiveReview = !terminal'
          assert text.count(marker) == 1
          p.write_text(text.replace(marker, 'includeInteractiveReview = true'))
          PY
          git -C "$control" diff --binary > "$out/control.patch"
          git rev-parse HEAD > "$out/candidate-source.txt"
          (cd compose && ./gradlew --no-configuration-cache --max-workers=2 \
            :business-domain:jvmTest --tests '**.LocalCashImportRecalculationTest' --tests '**.LocalCashImportBusinessPlanTest' \
            :client-operations:jvmTest --tests '**.CashImportRecoveryEntryParityTest' \
            :cashImportWorker:compileKotlinWasmJs :backend:installDist :cli:stageNpm)
          cp compose/business-domain/build/test-results/jvmTest/TEST-*LocalCashImportBusinessPlanTest.xml "$out/"
          (cd "$control/compose" && ./gradlew --no-configuration-cache --max-workers=2 :cli:stageNpm)
          (cd compose && ./gradlew --stop)
          npm pack --json --pack-destination "$out/base" "$control/compose/cli/build/npm" > "$out/base/pack.json"
          npm pack --json --pack-destination "$out/terminal" compose/cli/build/npm > "$out/terminal/pack.json"
          for label in base terminal; do
            mkdir -p "$out/$label/installed"
            npm install --prefix "$out/$label/installed" --ignore-scripts --engine-strict --no-audit --no-fund "$out/$label"/*.tgz
            sha256sum "$out/$label"/*.tgz | cut -d' ' -f1 > "$out/$label/package-sha256.txt"
          done
      - name: Prepare one batch and compare reviews using cloned state
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/terminal-context"
          export FT_DIAGNOSTIC_REVIEW_VARIANTS=$(node -e 'const p=process.argv[1]; console.log(JSON.stringify(Object.fromEntries(["base","terminal"].map(n=>[n,`${p}/${n}/installed/node_modules/.bin/ft`]))))' "$out")
          export FT_PERF_CLI_PACKAGE=$(find "$out/base" -maxdepth 1 -type f -name '*.tgz')
          export FT_TEST_POSTGRES_URL="$FT_DIAGNOSTIC_PG/review_context_test"
          export FT_PERF_ARTIFACTS="$out/reviews" FT_PERF_EVENTS="$out/reviews/measurements.jsonl"
          export FT_PERF_LIVE_MEMORY_FORCE_GC=1
          node compose/client-operations/perf/large-bench.mjs
      - name: Capture and summarize one small review heap inside the runner
        if: always() && steps.packages.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          out="$RUNNER_TEMP/terminal-context"
          temporary=$(mktemp -d "$RUNNER_TEMP/private-review-heap.XXXXXX")
          trap 'rm -rf -- "$temporary"' EXIT
          perf=compose/client-operations/perf
          python3 "$perf/diagnosis/small-review-fixture.py" "$perf/fixtures/large-cash.py" \
            "$temporary/fixture" compose/backend/build/install/backend
          export FT_PERF_WORKSPACE_DIAGNOSTIC_FIXTURE="$temporary/fixture/128"
          export FT_DIAGNOSTIC_REVIEW_VARIANTS=$(node -e 'const p=process.argv[1]; console.log(JSON.stringify(Object.fromEntries(["base","terminal"].map(n=>[n,`${p}/${n}/installed/node_modules/.bin/ft`]))))' "$out")
          export FT_PERF_CLI_PACKAGE=$(find "$out/base" -maxdepth 1 -type f -name '*.tgz')
          export FT_TEST_POSTGRES_URL="$FT_DIAGNOSTIC_PG/review_context_heap_test"
          export FT_PERF_ARTIFACTS="$out/small-heap" FT_PERF_EVENTS="$out/small-heap/measurements.jsonl"
          export FT_DIAGNOSTIC_REVIEW_HEAP=1 FT_DIAGNOSTIC_HEAP_PATH="$temporary/review.heapsnapshot"
          node "$perf/large-bench.mjs"
          if [[ -f "$FT_DIAGNOSTIC_HEAP_PATH" ]]; then
            node "$perf/diagnosis/aggregate-review-heap.mjs" "$FT_DIAGNOSTIC_HEAP_PATH" > "$out/small-heap/retained-heap-summary.json"
          fi
      - name: Upload review-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-context-diagnostic-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/terminal-context/candidate-source.txt
            ${{ runner.temp }}/terminal-context/control.patch
            ${{ runner.temp }}/terminal-context/TEST-*LocalCashImportBusinessPlanTest.xml
            ${{ runner.temp }}/terminal-context/**/pack.json
            ${{ runner.temp }}/terminal-context/**/package-sha256.txt
            ${{ runner.temp }}/terminal-context/**/large-details.json
            ${{ runner.temp }}/terminal-context/**/measurements.jsonl
            ${{ runner.temp }}/terminal-context/**/*.live-memory.jsonl
            ${{ runner.temp }}/terminal-context/**/retained-heap-summary.json
            ${{ runner.temp }}/terminal-context/**/exit.txt
          if-no-files-found: error
          retention-days: 30
