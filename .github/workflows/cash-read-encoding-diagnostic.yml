name: Cash read encoding diagnostic

on:
  push:
    branches: [perf/encode-cash-read-rows]

permissions:
  contents: read

jobs:
  read-encoding:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ft_performance
          POSTGRES_PASSWORD: disposable_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ft_performance"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CASH_READ_BASE: 2dbc32a3346560b92b1920c538d77baffa87dda1
      FT_DIAGNOSTIC_PG: postgresql://ft_performance:disposable_ci_password@127.0.0.1:5432
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare dedicated synthetic databases and delegated memory accounting
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qpdf postgresql-client time
          for database in contract baseline_real baseline_replay encoded_real encoded_replay; do
            psql "$FT_DIAGNOSTIC_PG/postgres" -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE cash_read_${database}_test"
          done
          parent=$(sudo mktemp -d /sys/fs/cgroup/ft-perf-XXXXXX)
          printf '+memory\n' | sudo tee "$parent/cgroup.subtree_control" >/dev/null
          sudo chown "$(id -u):$(id -g)" "$parent"
          printf 'FT_PERF_CGROUP_PARENT=%s\nFT_PERF_CGROUP_SUDO=1\n' "$parent" >> "$GITHUB_ENV"
      - name: Verify exact row and response contracts, then build both versions
        env:
          FT_TEST_POSTGRES_URL: postgresql://ft_performance:disposable_ci_password@127.0.0.1:5432/cash_read_contract_test
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cash-read-diagnostic"
          mkdir -p "$out" "$RUNNER_TEMP/diagnostic-npm"
          git worktree add --detach "$RUNNER_TEMP/read-baseline" "$CASH_READ_BASE"
          git rev-parse HEAD > "$out/candidate-source.txt"
          git -C "$RUNNER_TEMP/read-baseline" rev-parse HEAD > "$out/baseline-source.txt"
          (cd compose && ./gradlew --no-configuration-cache --max-workers=2 :backend:test \
            --tests '**.CompatibleReadPageProtocolTest' --tests '**.CashWriteSetReceiptTest' --tests '**.OpenApiContractTest' \
            :backend:installDist :backend:stagePerformanceReplayClasspath :cli:stageNpm)
          cp compose/backend/build/test-results/test/TEST-*.xml "$out/"
          (cd "$RUNNER_TEMP/read-baseline/compose" && ./gradlew --no-configuration-cache --max-workers=2 \
            :backend:installDist :backend:stagePerformanceReplayClasspath)
          (cd compose && ./gradlew --stop)
          npm pack --json --pack-destination "$RUNNER_TEMP/diagnostic-npm" compose/cli/build/npm > "$out/pack.json"
      - name: Measure both installed versions sequentially on one Linux VM
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cash-read-diagnostic"
          package=$(find "$RUNNER_TEMP/diagnostic-npm" -maxdepth 1 -type f -name '*.tgz')
          test -f "$package"
          export FT_PERF_CLI_PACKAGE="$package"
          result=0
          for label in baseline_replay encoded_replay encoded_real baseline_real; do
            checkout="$GITHUB_WORKSPACE"
            if [[ "$label" = baseline_* ]]; then checkout="$RUNNER_TEMP/read-baseline"; fi
            unset FT_PERF_ISOLATED_BACKEND
            if [[ "$label" = *_replay ]]; then export FT_PERF_ISOLATED_BACKEND=1; fi
            export FT_TEST_POSTGRES_URL="$FT_DIAGNOSTIC_PG/cash_read_${label}_test"
            export FT_PERF_ARTIFACTS="$out/$label" FT_PERF_EVENTS="$out/$label/measurements.jsonl"
            mkdir -p "$FT_PERF_ARTIFACTS"
            status=0
            (cd "$checkout" && node compose/client-operations/perf/large-bench.mjs) || status=$?
            printf '%s\n' "$status" > "$FT_PERF_ARTIFACTS/exit.txt"
            if [ "$status" -ne 0 ]; then result=1; fi
          done
          exit "$result"
      - name: Upload synthetic aggregate measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cash-read-encoding-diagnostic-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cash-read-diagnostic/*-source.txt
            ${{ runner.temp }}/cash-read-diagnostic/pack.json
            ${{ runner.temp }}/cash-read-diagnostic/**/large-details.json
            ${{ runner.temp }}/cash-read-diagnostic/**/measurements.jsonl
            ${{ runner.temp }}/cash-read-diagnostic/**/exit.txt
          if-no-files-found: error
          retention-days: 30
