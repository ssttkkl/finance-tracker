version: 3
source: openspec/specs/shared/design-system/tokens/*.tokens.json
theme: compose/shared/src/commonMain/kotlin/com/finance/tracker/core/FinanceTheme.kt
implementation: compose/shared/src/commonMain/kotlin/com/finance/tracker/presentation
pageSource: Compose screens and AppShell define page structure, region order, and responsive behavior
controls:
  Material3/Button:
    compose: [Button, OutlinedButton, TextButton, FilledTonalButton]
    theme: FinanceTheme
    states: [default, focused, disabled, loading]
    callsiteResponsibilities: [businessAction, label, semanticId, accessibility]
  Material3/TextField:
    compose: [OutlinedTextField, TextField]
    theme: FinanceTheme
    states: [default, focused, disabled, error]
    callsiteResponsibilities: [label, inputType, validation, semanticId, accessibility]
sharedFinanceHelpers:
  Finance/Select:
    compose: ChoicePicker
    states: [default, expanded, disabled]
  Finance/FilterBar:
    compose: FinanceFilterBar
    states: [default, dirty, disabled]
  Finance/DataTable:
    compose: FinanceDataTable
    screens: [InvestmentHoldingsScreen, InvestmentEventsScreen]
    states: [loading, ready, empty, error]
  Finance/Amount:
    compose: FinanceAmount
    variants: [income, expense, neutral]
