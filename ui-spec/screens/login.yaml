id: login
kind: screen
title: 认证入口
platforms: [compose-web, android, ios]
purpose: 用户登录、注册并恢复工作区会话
contract:
  modes: [login, register]
  fields:
    - id: email
      type: email
      required: true
      label: 邮箱
    - id: password
      type: password
      required: true
      label: 密码
  actions:
    - id: submit
      semantics: 当前模式下提交认证请求
    - id: switch-mode
      semantics: 在登录和注册之间切换
  states: [normal, validation-error, service-error, submitting, disabled, success]
  responsive:
    compact: 单列，表单最大宽度受视口约束
    regular: 单列，表单宽度不超过 720px
    wide: 单列，表单宽度不超过 720px，保留品牌留白
  themes: [light, dark]
  accessibility:
    - email and password have stable labels and semantic ids
    - submit exposes loading and disabled state
    - validation and service errors use alert semantics
implementation:
  compose: compose/shared/src/commonMain/kotlin/com/finance/tracker/presentation/AccessScreens.kt
  viewModel: compose/shared/src/commonMain/kotlin/com/finance/tracker/presentation/AccessViewModel.kt
  design: design/login.pen
