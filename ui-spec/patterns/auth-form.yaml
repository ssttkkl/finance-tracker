id: auth-form
kind: pattern
purpose: 登录与注册共用的认证表单结构
regions:
  - brand-mark
  - mode-switch
  - email-field
  - password-field
  - submit-button
  - feedback
invariants:
  - email-field and password-field remain ordered before submit-button
  - feedback is adjacent to the field or submit action that caused it
  - compact is single-column with no horizontal scrolling
states: [normal, validation-error, service-error, submitting, disabled]
