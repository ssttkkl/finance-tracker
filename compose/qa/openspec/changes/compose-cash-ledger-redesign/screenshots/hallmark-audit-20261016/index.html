<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compose 收支账本 · Hallmark 审查截图</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, "Noto Sans SC", sans-serif; background: #f5f5f5; color: #222; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { padding: 28px max(20px, calc((100vw - 1480px) / 2)); background: white; border-bottom: 1px solid #ddd; }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 3vw, 34px); }
    header p { margin: 6px 0; color: #555; line-height: 1.55; }
    main { max-width: 1480px; margin: 0 auto; padding: 20px; }
    section { margin: 0 0 32px; }
    h2 { margin: 24px 0 12px; font-size: 20px; }
    h3 { margin: 22px 0 10px; padding-bottom: 8px; border-bottom: 1px solid #ddd; font-size: 16px; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    a { color: inherit; text-decoration: none; }
    figure { margin: 0; overflow: hidden; border: 1px solid #d5d5d5; border-radius: 10px; background: white; }
    img { display: block; width: 100%; height: auto; }
    figcaption { padding: 8px 10px; color: #555; font-size: 13px; }
    @media (max-width: 760px) { main { padding: 14px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>收支账本重构 · Hallmark 审查</h1>
    <p>实际 Compose Web 页面截图，覆盖浅色/深色、COMPACT 390×844、REGULAR 768×1024、WIDE 1440×1000。</p>
    <p>包括列表、筛选、选择与 FAB、批量操作、新增/编辑/详情、关联创建表单、关联折叠区及错误/空状态。</p>
  </header>
  <main id="gallery"></main>
  <script>
    const widths = [
      { key: "compact", width: 390, height: 844 },
      { key: "regular", width: 768, height: 1024 },
      { key: "wide", width: 1440, height: 1000 },
    ];
    const scenes = [
      ["列表", "list"],
      ["详细筛选展开", "filters-open"],
      ["详细筛选完成后关闭", "filters-done-closed"],
      ["详细筛选 Escape 关闭", "filters-escape-closed"],
      ["选择模式", "batch-selection-toolbar"],
      ["FAB 空闲菜单", "fab-idle"],
      ["FAB 批量菜单", "fab-batch"],
      ["批量分类弹窗", "batch-category-dialog"],
      ["批量分类选项", "batch-category-options"],
      ["批量分类应用前", "batch-classify-ready"],
      ["批量分类取消后", "batch-classify-cancelled"],
      ["批量分类应用后", "batch-classify-applied"],
      ["批量删除确认", "batch-delete-confirm"],
      ["批量删除取消后", "batch-delete-cancelled"],
      ["账本加载错误与重试", "ledger-api-error"],
      ["账本空状态", "ledger-api-empty"],
      ["新增流水", "record-create"],
      ["无关联流水详情", "record-detail"],
      ["编辑流水", "record-edit"],
      ["删除流水确认", "record-delete-confirm"],
      ["关联流水折叠", "related-detail"],
      ["新增关联表单", "relation-composer"],
      ["关联流水展开", "related-detail-expanded"],
      ["关联流水滚动内容", "related-detail-expanded-scrolled"],
      ["关联流水删除确认", "related-record-delete-confirm"],
    ];
    const root = document.querySelector("#gallery");
    for (const [themeName, themeDir] of [["浅色", ""], ["深色", "dark/"]]) {
      const theme = document.createElement("section");
      const title = document.createElement("h2");
      title.textContent = `${themeName}主题`;
      theme.append(title);
      for (const [label, prefix] of scenes) {
        const group = document.createElement("section");
        const heading = document.createElement("h3");
        heading.textContent = label;
        group.append(heading);
        const grid = document.createElement("div");
        grid.className = "grid";
        for (const size of widths) {
          const filename = `${prefix}-${size.key}-${size.width}.png`;
          const href = `../current-review-20261015/${themeDir}${filename}`;
          const link = document.createElement("a");
          link.href = href;
          link.target = "_blank";
          link.rel = "noreferrer";
          const figure = document.createElement("figure");
          const image = document.createElement("img");
          image.src = href;
          image.alt = `${label} · ${size.key.toUpperCase()} ${size.width}×${size.height}`;
          image.loading = "lazy";
          const caption = document.createElement("figcaption");
          caption.textContent = `${size.key.toUpperCase()} · ${size.width}×${size.height}`;
          figure.append(image, caption);
          link.append(figure);
          grid.append(link);
        }
        group.append(grid);
        theme.append(group);
      }
      root.append(theme);
    }
  </script>
</body>
</html>
