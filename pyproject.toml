[project]
name = "finance-tracker"
version = "0.1.0"
description = "Finance Tracker - 资产+消费趋势管理"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.0",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.9",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.41",
    "xlrd>=2.0.2",
    "yfinance>=1.4.1",
]

[project.scripts]
ft = "ft.cli:main"

[tool.uv.sources]
finance-tracker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "xlwt>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ft"]
