<!-- Hallmark · prototype: Workbench / Ledger Grid · theme: Cobalt · self-check: shell, select, mapping, preview, relations, error, loading, success, responsive -->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>导入账单原型</title>
  <style>
    :root{--paper:#f1f5f9;--raised:#fff;--ink:#1f2937;--muted:#64748b;--rule:#b8c4d2;--sidebar:#17212b;--sidebar-raised:#263544;--accent:#0969c2;--accent-soft:#e3f0ff;--danger:#a64f4f;--space:16px;--mono:ui-monospace,SFMono-Regular,monospace;--body:system-ui,"Noto Sans SC",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;min-width:0;overflow-x:clip;background:var(--paper);color:var(--ink);font-family:var(--body)}button,select{font:inherit}button{min-height:40px;padding:0 14px;border:1px solid var(--rule);background:var(--raised);color:var(--ink)}button.primary{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:700}.shell{min-height:100vh;display:grid;grid-template-columns:224px minmax(0,1fr)}aside{display:flex;flex-direction:column;gap:28px;padding:28px 18px;background:var(--sidebar);color:#e3edf7}aside strong{font:600 13px var(--mono);letter-spacing:.1em}nav a{display:block;padding:10px 12px;color:inherit;text-decoration:none}nav a.current{border-left:2px solid #67b4ff;background:var(--sidebar-raised)}main{width:100%;max-width:1480px;margin:auto;padding:42px clamp(24px,4vw,68px) 52px}.header{display:flex;align-items:end;justify-content:space-between;margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--rule)}h1{margin:0;font-size:32px}.steps{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:16px;border-bottom:1px solid var(--rule)}.steps button{display:flex;align-items:center;gap:9px;border:0;border-bottom:3px solid transparent;background:transparent;color:#8997a6;text-align:left}.steps button.current{border-color:var(--accent);color:var(--accent);font-weight:700}.steps b{display:grid;place-items:center;width:25px;height:25px;border:1px solid currentColor;border-radius:50%;font:12px var(--mono)}.stage{display:grid;gap:16px;padding:32px;border:1px solid var(--rule);background:var(--raised)}.drop{display:grid;justify-items:center;gap:9px;min-height:240px;padding:32px;border:1px dashed var(--rule);background:#eef3f8;text-align:center}.drop input{position:absolute;width:1px;height:1px;opacity:0}.drop-mark{display:grid;place-items:center;width:48px;height:48px;border:1px solid var(--accent);border-radius:50%;color:var(--accent);font-size:24px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.summary div{display:flex;justify-content:space-between;align-items:end;min-height:75px;padding:13px 15px;border:1px solid var(--rule);background:#eef3f8}.summary strong{font:26px var(--mono)}.table-wrap{max-width:100%;overflow:auto;border:1px solid var(--rule)}table{width:100%;min-width:1250px;border-collapse:collapse;font-size:12px}th,td{padding:12px;border-bottom:1px solid #d7dee7;text-align:left;white-space:nowrap}th{background:var(--sidebar);color:#e3edf7;font-size:11px}.relations{width:100%;min-width:760px}.relations th,.relations td{padding:9px 10px}.pager{display:flex;justify-content:center;gap:12px;padding:12px}.state{padding:12px;border-left:3px solid var(--accent);background:var(--accent-soft)}
    @media(max-width:820px){.shell{display:block}aside{min-height:64px;padding:12px 16px;flex-direction:row;align-items:center;justify-content:space-between}aside nav{display:none}main{padding:24px 16px}.stage{padding:18px;margin:0 -16px;border-right:0;border-left:0}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.table-wrap{margin:0 -16px;border-right:0;border-left:0}}
    @media(max-width:520px){.steps button{gap:5px;padding:0 2px;font-size:11px}.steps b{width:22px;height:22px;font-size:10px}.summary{gap:8px}.summary div{display:grid;align-content:space-between;min-height:78px}.stage-actions{display:grid;grid-template-columns:1fr 1fr}.stage-actions button{width:100%}}
  </style>
</head>
<body>
  <div class="shell">
    <aside aria-label="统一应用外壳"><strong>Finance Tracker</strong><nav aria-label="主要导航"><a class="current" href="#">导入账单</a><a href="#">收支账本</a><a href="#">分类管理</a><a href="#">投资账本</a></nav></aside>
    <main>
      <header class="header"><h1>导入账单</h1></header>
      <nav class="steps" aria-label="导入步骤"><button class="current"><b>1</b>选择文件</button><button><b>2</b>映射账户</button><button><b>3</b>核对流水</button><button><b>4</b>配对</button></nav>
      <section class="stage" aria-label="选择文件"><h2>选择文件</h2><label class="drop"><input type="file"><span class="drop-mark">↑</span><strong>拖入账单文件</strong><small>CSV、XLS、XLSX、PDF</small></label><div class="stage-actions"><button>取消</button><button class="primary">选择账单文件</button></div></section>
      <section class="stage" aria-label="核对流水"><h2>核对流水</h2><div class="summary"><div>全部<strong>985</strong></div><div>待新增<strong>985</strong></div><div>已存在<strong>0</strong></div><div>暂不支持<strong>0</strong></div></div><div class="table-wrap" tabindex="0"><table><thead><tr><th>发生时间</th><th>金额</th><th>币种</th><th>账户</th><th>交易对方</th><th>对方账号</th><th>流水类型</th><th>业务细分</th><th>分类</th></tr></thead><tbody><tr><td>2025-06-13 09:57</td><td>-15.3</td><td>CNY</td><td>零钱</td><td>麦当劳</td><td>—</td><td>消费</td><td>not_applicable</td><td>expense</td></tr></tbody></table></div></section>
      <section class="stage" aria-label="加载与错误状态"><div class="state">正在读取账单…</div><div class="state" role="alert">确认导入失败，请重试。</div><div class="state">导入完成　985 条流水</div></section>
    </main>
  </div>
</body>
</html>
