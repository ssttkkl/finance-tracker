<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作区管理 · 原型</title>
  <style>
    /* Hallmark · prototype · macrostructure: Workbench / Management Split · theme: Cobalt · responsive: 320/375/390/414/768/1440 */
    :root{--paper:#f4f6f9;--panel:#fff;--ink:#172033;--muted:#68758a;--rule:#d8dee8;--sidebar:#202936;--sidebar-raised:#2b3645;--side-ink:#d7deea;--accent:#3d6fe8;--accent-soft:#e9efff;--danger:#b94a2f;--success:#247957;font-family:"Noto Sans SC",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
    *{box-sizing:border-box}html,body{min-width:0;margin:0;background:var(--paper)}body{min-height:100vh}button,input,select{font:inherit}button{min-height:42px;padding:0 14px;border:1px solid var(--rule);border-radius:4px;background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}button:hover{border-color:var(--accent);background:var(--accent-soft)}button.primary{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:650}button.text{padding:0;border-color:transparent;background:transparent;color:var(--muted)}button.danger{color:var(--danger)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button svg{width:15px;height:15px;vertical-align:-3px;margin-right:7px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}button.text svg{margin-right:5px}input,select{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--panel);color:var(--ink)}input:disabled,select:disabled{background:#f1f3f6;color:#9aa5b5;cursor:not-allowed}
    .shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}.sidebar{display:flex;flex-direction:column;padding:28px 18px;background:var(--sidebar);color:var(--side-ink)}.brand{font:600 13px/1 ui-monospace,monospace;letter-spacing:.1em}.nav{display:grid;gap:5px;margin-top:34px}.nav a{padding:11px 12px;border-left:2px solid transparent;color:var(--side-ink);text-decoration:none}.nav a.current{border-color:#91adff;background:var(--sidebar-raised)}.account{margin-top:auto;padding-top:18px;border-top:1px solid var(--sidebar-raised);color:#b5c0d0;font-size:12px}.account strong{display:block;color:var(--side-ink);font-size:13px}.account select{margin-top:8px;border-color:var(--sidebar-raised);background:var(--sidebar-raised);color:var(--side-ink);font-size:12px}
    .content{min-width:0;padding:48px clamp(24px,4vw,68px) 64px;overflow:auto}.content-inner{width:100%;max-width:1600px;margin:0 auto}.eyebrow{margin:0;color:var(--accent);font:600 12px ui-monospace,monospace;letter-spacing:.08em}.page-title{margin:8px 0 28px;font-size:34px;line-height:1.15;letter-spacing:-.04em}.identity{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(240px,.8fr);gap:24px;align-items:end;padding:22px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}.field{display:grid;gap:7px;color:var(--muted);font-size:12px}.field-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.readonly-id{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}.readonly-id code{display:block;padding:10px 0;color:var(--ink);font:14px ui-monospace,monospace;overflow-wrap:anywhere}.section-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.55fr);gap:32px;margin-top:34px}.section{min-width:0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:12px}.section h2{margin:0;font-size:18px}.member-list{border-top:1px solid var(--rule)}.member{display:grid;grid-template-columns:minmax(0,1fr) 140px auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--rule)}.member-copy{min-width:0}.member-copy strong,.member-copy small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.member-copy small{margin-top:4px;color:var(--muted);font-size:12px}.member select{min-width:0}.invite-section{padding-left:24px;border-left:1px solid var(--rule)}.invite-form{display:grid;gap:12px}.invite-result{display:grid;gap:6px;margin-top:18px}.invite-result[hidden]{display:none}.invite-result small{color:var(--success)}.invite-result input{font:12px ui-monospace,monospace}.danger-zone{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:42px;padding-top:18px;border-top:1px solid var(--rule)}.danger-zone h2{margin:0;font-size:16px}.confirm-layer{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:rgb(23 32 51 / 48%)}.confirm-layer[hidden]{display:none}.confirm-card{width:min(420px,100%);padding:22px;border:1px solid var(--rule);background:var(--panel);box-shadow:0 18px 44px rgb(23 32 51 / 24%)}.confirm-card h2{margin:0;font-size:18px}.confirm-card p{margin:14px 0;color:var(--muted);font-size:13px;line-height:1.55}.confirm-card label{display:grid;gap:7px;color:var(--muted);font-size:12px}.confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.feedback{margin:14px 0 0;padding:10px 12px;border-left:3px solid var(--success);background:#edf8f3;color:var(--success);font-size:13px}.error{border-left-color:var(--danger);background:#fff3ef;color:var(--danger)}.empty{padding:28px 0;border-bottom:1px solid var(--rule);color:var(--muted)}.state-switch{display:flex;gap:6px;margin-top:40px;padding-top:14px;border-top:1px dashed var(--rule);color:var(--muted);font-size:11px}.state-switch a{color:var(--muted)}
    @media(max-width:1023px){.shell{display:block}.sidebar{min-height:0;padding:18px 16px}.nav{margin-top:22px}.account{margin-top:22px}.content{padding:32px 24px 48px;overflow:visible}.section-grid{grid-template-columns:minmax(0,1fr)}}
    @media(max-width:620px){.sidebar{padding:14px 16px}.nav{margin-top:16px}.account{margin-top:16px}.content{padding:24px 16px 40px}.page-title{margin-bottom:22px;font-size:29px}.identity{grid-template-columns:minmax(0,1fr);gap:18px;padding:18px 0}.section-grid{gap:28px;margin-top:26px}.invite-section{padding:26px 0 0;border-top:1px solid var(--rule);border-left:0}.member{grid-template-columns:minmax(0,1fr) 108px;gap:10px;padding:14px 0}.member button{grid-column:1/-1;justify-self:start}.section-head{align-items:start;flex-direction:column}.state-switch{display:none}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">FINANCE TRACKER</div>
      <nav class="nav" aria-label="主要导航">
        <a href="#">收支账本</a><a href="#">分类管理</a><a href="#">投资账本</a><a href="#">当前持仓</a><a href="#">投资事件</a><a class="current" href="#">工作区管理</a>
      </nav>
      <div class="account"><strong>admin@ssttkkl.fun</strong><select aria-label="当前工作区"><option>家庭账本</option></select></div>
    </aside>
    <main class="content">
      <div class="content-inner">
        <h1 class="page-title">工作区管理</h1>
        <section class="identity" aria-label="工作区信息">
          <label class="field">工作区名称<div class="field-row"><input id="workspace-name" value="家庭账本"><button class="primary" id="save-name"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v6h8V4M8 20v-5h8v5"/></svg>保存</button></div></label>
          <div class="field">固定 ID<div class="readonly-id"><code>default</code><button id="copy-id"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="9" y="9" width="10" height="10" rx="1"/><path d="M15 9V5H5v10h4"/></svg>复制</button></div></div>
        </section>
        <p id="feedback" class="feedback" hidden role="status"></p>
        <div class="section-grid">
          <section class="section" aria-labelledby="members-title"><div class="section-head"><h2 id="members-title">成员</h2><span class="eyebrow">2 位成员</span></div><div class="member-list" id="member-list"><div class="member"><div class="member-copy"><strong>你</strong><small>admin@ssttkkl.fun</small></div><span>管理员</span></div><div class="member"><div class="member-copy"><strong>林夕</strong><small>linxi@example.com</small></div><select aria-label="林夕的权限"><option>可编辑</option><option>仅可查看</option></select><button class="text danger"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>移除</button></div></div></section>
          <section class="section invite-section" aria-labelledby="invite-title"><div class="section-head"><h2 id="invite-title">邀请成员</h2></div><form class="invite-form" id="invite-form"><label class="field">权限<select><option>可编辑</option><option>仅可查看</option></select></label><button class="primary"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/></svg>创建链接</button></form><div class="invite-result" id="invite-result" hidden><small>链接已生成</small><input readonly value="https://app.example.com/?invite=7nX4…" aria-label="邀请链接"></div></section>
        </div>
        <section class="danger-zone" aria-labelledby="delete-title"><h2 id="delete-title">删除工作区</h2><button type="button" class="text danger" id="delete-workspace">删除工作区</button></section>
        <div class="confirm-layer" id="delete-confirm" role="alertdialog" aria-modal="true" aria-labelledby="delete-confirm-title" hidden><div class="confirm-card"><h2 id="delete-confirm-title">删除工作区？</h2><p>将永久删除当前工作区及其全部账本数据、成员和邀请。</p><label>输入工作区名称<input id="delete-name" autocomplete="off"></label><div class="confirm-actions"><button type="button" id="cancel-delete">取消</button><button type="button" class="danger" id="confirm-delete" disabled>删除工作区</button></div></div></div>
        <div class="state-switch">原型状态：<a href="?state=normal">正常</a> · <a href="?state=empty">空成员</a> · <a href="?state=error">保存错误</a> · <a href="?mode=viewer">仅可查看</a></div>
      </div>
    </main>
  </div>
  <script>
    const params=new URLSearchParams(location.search), state=params.get('state')||'normal', viewer=params.get('mode')==='viewer';
    const feedback=document.querySelector('#feedback'), nameInput=document.querySelector('#workspace-name'), save=document.querySelector('#save-name'), copy=document.querySelector('#copy-id'), inviteForm=document.querySelector('#invite-form'), inviteResult=document.querySelector('#invite-result'), members=document.querySelector('#member-list'), deleteButton=document.querySelector('#delete-workspace'), deleteLayer=document.querySelector('#delete-confirm'), deleteName=document.querySelector('#delete-name'), confirmDelete=document.querySelector('#confirm-delete');
    function show(message, error=false){feedback.hidden=false;feedback.textContent=message;feedback.classList.toggle('error',error)}
    if(state==='empty'){members.innerHTML='<div class="empty">暂无其他成员</div>';document.querySelector('.section-head .eyebrow').textContent='仅你';}
    if(state==='error'){show('无法保存，请稍后重试。',true)}
    if(viewer){nameInput.disabled=true;save.disabled=true;copy.disabled=false;inviteForm.querySelector('select').disabled=true;inviteForm.querySelector('button').disabled=true;deleteButton.disabled=true;document.querySelector('.danger-zone').hidden=true;document.querySelectorAll('.member select,.member button').forEach(el=>el.disabled=true)}
    save.addEventListener('click',()=>show('已保存'));
    copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText('default')}catch{}show('已复制')});
    inviteForm.addEventListener('submit',event=>{event.preventDefault();inviteResult.hidden=false});
    deleteButton.addEventListener('click',()=>{deleteLayer.hidden=false;deleteName.focus()});
    deleteName.addEventListener('input',()=>{confirmDelete.disabled=deleteName.value!==nameInput.value});
    document.querySelector('#cancel-delete').addEventListener('click',()=>{deleteLayer.hidden=true;deleteName.value='';confirmDelete.disabled=true;deleteButton.focus()});
    confirmDelete.addEventListener('click',()=>{deleteLayer.hidden=true;show('已删除')});
  </script>
</body>
</html>
